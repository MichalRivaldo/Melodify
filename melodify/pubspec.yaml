name: melodify
description: "Melodify - Aplikasi Streaming Musik (Spotify Clone)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP requests ke backend API
  http: ^1.2.2

  # State management sederhana
  provider: ^6.1.2

  # Audio player untuk memutar lagu
  audioplayers: ^6.1.0

  # Simpan token login secara lokal
  shared_preferences: ^2.3.2

  # Ikon tambahan
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
